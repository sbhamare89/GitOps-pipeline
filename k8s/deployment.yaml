apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-deploy
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: sbhamare/nginx-gitops:latest
          ports:
            - containerPort: 8080
              protocol: TCP
